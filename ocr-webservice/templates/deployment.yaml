apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-webservice
spec:
  selector:
    matchLabels:
      app: ocr-webservice
  template:
    metadata:
      labels:
        app: ocr-webservice
    spec:
      containers:
        - name: ocr-webservice
          image: vitezalexandra/ocr-react-webservice:{{.Values.env.APP_VERSION}}
          ports:
            - name: http
              containerPort: 8080
              Protocol: TCP
          env:
            - name: AWS_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: {{.Values.s3.connectionConfigMapName}}
                  key: {{.Values.s3.urlKey}}
            - name: BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{.Values.s3.connectionConfigMapName}}
                  key: {{.Values.s3.bucketKey}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{.Values.s3.accessSecretName}}
                  key: {{.Values.s3.accessKeyKey}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{.Values.s3.accessSecretName}}
                  key: {{.Values.s3.secretAccessKeyKey}}
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{.Values.database.connectionConfigMapName}}
                  key: {{.Values.database.urlKey}}
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{.Values.database.connectionConfigMapName}}
                  key: {{.Values.database.portKey}}
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{.Values.database.connectionConfigMapName}}
                  key: {{.Values.database.userKey}}
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{.Values.database.connectionConfigMapName}}
                  key: {{.Values.database.databaseKey}}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{.Values.database.credentialSecretName}}
                  key: {{.Values.database.passwordKey}}