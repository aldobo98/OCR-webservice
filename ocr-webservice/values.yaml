env:
  #APP_VERSION tartalmazza a git commit SHA-t, amit a docker image buildelésére, majd a podban tagelésre fogunk használni.
  APP_VERSION: ba27cf71aa0b73fa27623980e85d4f5608466ee7

s3:
  #Secret, amiben benne van az S3 access key és secret access key.
  accessSecretName: s3-credentials
  #A két kulcsérték, amiben az accessKey és a secretAccessKey található. A default értékek azok, amiket az S3 is defaultból megad.
  accessKeyKey: AWS_ACCESS_KEY_ID
  secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  #configmap, amely tárolja az S3 URL-t és a bucketet.
  connectionConfigMapName: s3-data
  urlKey: URL
  bucketKey: bucket

database:
  #Secret, amiben benne van az adatbázis felhasználóhoz tartozó jelszó
  credentialSecretName: sql-credentials
  #A secretben ezen a kulcson található a jelszó
  passwordKey: password
  connectionConfigMapName: sql-data
  urlKey: URL
  portKey: port
  databaseKey: database
  userKey: user
  tableKey: table

