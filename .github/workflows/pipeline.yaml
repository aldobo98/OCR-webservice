name: OCR-webservice publish pipeline

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    DOCKERHUB_KEY: ${{ secrets.DOCKER_KEY }}

# A helm chartos módosításokra nem akarunk pipeline-t futtatni
jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            #Arra vagyunk kíváncsiak, hogy a service-ben történt-e a módosítás
            webservice: ${{ steps.filter.outputs.service }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                filters: |
                    service:
                        - '!(ocr-webservice/**)/**'

    lint-webservice:
        needs: changes
        if: ${{ needs.changes.outputs.webservice == 'true' }}
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v2
        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v8
          with:
            working-directory: OCR-backend

    build-webservice:
        runs-on: ubuntu-latest
        needs:  [lint-webservice, changes]
        if: ${{needs.changes.outputs.webservice == 'true'}}
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            - name: Login to Docker Hub
              uses: docker/login-action@v1
              with:
                username: ${{ env.DOCKERHUB_USERNAME }}
                password: ${{ env.DOCKERHUB_KEY }}
            - name: Build and push Docker image
              run: |
                make DOCKERHUB_USERNAME=${{env.DOCKERHUB_USERNAME}} IMAGE_TAG=${{github.sha}}  build-push
    
    update-helm-values:
        runs-on: ubuntu-latest
        needs: [build-webservice, lint-webservice, changes]
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            - name: Update values.yaml
              if: ${{needs.changes.outputs.webservice == 'true'}}
              run: |
                cd ocr-webservice
                sed -i 's|APP_VERSION:.*|APP_VERSION: '${{ github.sha }}'|' values.yaml 
                git config --global user.name 'GitHub Actions'
                git config --global user.email 'actions@github.com'
                git add values.yaml
                git commit -m "Update values.yaml after image build, ${{github.sha}}"
                git push
